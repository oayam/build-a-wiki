name: check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:14.24
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki_dev
          POSTGRES_DB: wiki_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wiki:wiki_dev@localhost:5432/wiki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup show
      - run: cd frontend && npm ci
      - run: bash scripts/check.sh
      - run: |
          cargo build --locked --manifest-path backend/Cargo.toml
          cargo run --locked --manifest-path backend/Cargo.toml --bin migrate
          python3 scripts/smoke.py
        env:
          DATABASE_URL: postgres://wiki:wiki_dev@localhost:5432/wiki_test
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: python3 scripts/e2e.py
